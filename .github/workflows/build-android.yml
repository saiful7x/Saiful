name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate release upload keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ runner.temp }}/saiful-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias saifulkey \
            -storepass saiful1234 \
            -keypass saiful1234 \
            -dname "CN=Saiful Sir, OU=Mobile, O=SaifulChatAI, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Debug APK & Signed Release AAB
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/saiful-release.jks
          ANDROID_KEYSTORE_PASSWORD: saiful1234
          ANDROID_KEY_ALIAS: saifulkey
          ANDROID_KEY_PASSWORD: saiful1234
        run: |
          gradle assembleDebug bundleRelease --no-daemon

      - name: Prepare output files
        run: |
          mkdir -p build-outputs
          cp android-native/app/build/outputs/apk/debug/app-debug.apk build-outputs/SaifulChatAI-debug.apk
          cp android-native/app/build/outputs/bundle/release/app-release.aab build-outputs/SaifulChatAI-release.aab

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaifulChatAI-Android-Builds
          path: |
            build-outputs/SaifulChatAI-debug.apk
            build-outputs/SaifulChatAI-release.aab

      - name: Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Saiful Chat AI v1.0.${{ github.run_number }}
          files: |
            build-outputs/SaifulChatAI-debug.apk
            build-outputs/SaifulChatAI-release.aab
